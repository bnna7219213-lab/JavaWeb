# ============================================
# 09-边缘渲染BFF基础版 配置
# ============================================

# 服务端口 - BFF层独立端口
server.port=8095

# 应用名称
spring.application.name=edge-bff-basic

# JSON格式化输出（开发调试用）
spring.jackson.serialization.indent-output=true

# 日志级别
logging.level.com.aether.bff=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
