<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 模块化单体进阶版</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="header advanced">
        <h1>商品管理</h1>
        <p class="subtitle">Product 模块（基础模块） - 通过 ProductModule 接口对外通信</p>
    </header>

    <nav class="nav">
        <a th:href="@{/}" class="nav-link">首页</a>
        <a th:href="@{/users}" class="nav-link">用户管理</a>
        <a th:href="@{/products}" class="nav-link active">商品管理</a>
        <a th:href="@{/orders}" class="nav-link">订单管理</a>
        <span class="nav-divider"></span>
        <a th:href="@{/notifications}" class="nav-link">通知中心</a>
        <a th:href="@{/audit}" class="nav-link">审计日志</a>
    </nav>

    <main class="container">
        <section class="card">
            <div class="card-header">
                <h2>商品列表</h2>
                <span class="badge" th:text="${#lists.size(products) + ' 个商品'}">0</span>
            </div>
            <table class="table">
                <thead>
                    <tr><th>ID</th><th>名称</th><th>描述</th><th>价格</th><th>库存</th></tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}">1</td>
                        <td th:text="${product.name}">MacBook</td>
                        <td th:text="${product.description}">描述</td>
                        <td th:text="'¥' + ${#numbers.formatDecimal(product.price, 1, 2)}">¥0.00</td>
                        <td th:text="${product.stock}">0</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h3>添加商品</h3>
            <form th:action="@{/products}" method="post" class="form">
                <div class="form-group"><label>名称：</label><input type="text" name="name" required></div>
                <div class="form-group"><label>描述：</label><input type="text" name="description"></div>
                <div class="form-group"><label>价格：</label><input type="number" name="price" step="0.01" required></div>
                <div class="form-group"><label>库存：</label><input type="number" name="stock" required></div>
                <button type="submit" class="btn btn-primary">添加商品</button>
            </form>
        </section>
    </main>

    <footer class="footer"><p>Product Module | 端口 8102</p></footer>
</body>
</html>
