<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servlet 传统Web示例</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 8px; }
        section { background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 20px 0; }
        label { display: inline-block; width: 60px; font-weight: 500; }
        input { padding: 6px 10px; border: 1px solid #dadce0; border-radius: 4px; margin: 4px; }
        button { background: #1a73e8; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1557b0; }
        #userBox { padding: 12px; background: white; border-radius: 4px; margin-top: 10px; min-height: 40px; }
        .msg { padding: 8px 12px; border-radius: 4px; margin-top: 10px; background: #e8f5e9; }
    </style>
</head>
<body>
    <h2>用户信息管理</h2>

    <!-- GET查询区域 -->
    <section>
        <h3>查询用户（GET）</h3>
        <button onclick="loadUser()">查询用户信息</button>
        <div id="userBox">点击按钮查询用户...</div>
    </section>

    <!-- POST提交区域 -->
    <section>
        <h3>新增用户（POST）</h3>
        <div>
            <label>姓名：</label>
            <input type="text" id="name" placeholder="请输入姓名" />
        </div>
        <div>
            <label>年龄：</label>
            <input type="number" id="age" placeholder="请输入年龄" />
        </div>
        <button onclick="addUser()">提交</button>
        <div id="resultMsg"></div>
    </section>

    <script>
        // GET请求：获取用户数据
        function loadUser() {
            fetch('api/user')
                .then(response => response.json())
                .then(res => {
                    if(res.code === 200) {
                        const user = res.data;
                        document.getElementById('userBox').innerHTML =
                            '<p>用户ID：' + user.id + '</p>' +
                            '<p>姓名：' + user.name + '</p>' +
                            '<p>年龄：' + user.age + '</p>';
                    }
                })
                .catch(err => {
                    document.getElementById('userBox').innerText = '请求失败：' + err;
                });
        }

        // POST请求：提交用户数据
        function addUser() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const msgBox = document.getElementById('resultMsg');

            fetch('api/user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({name: name, age: parseInt(age) || 0})
            })
            .then(res => res.json())
            .then(data => {
                msgBox.innerHTML = '<div class="msg">✅ ' + data.msg + '</div>';
                document.getElementById('name').value = '';
                document.getElementById('age').value = '';
            })
            .catch(err => {
                msgBox.innerHTML = '<div class="msg" style="background:#ffebee">❌ 请求异常：' + err + '</div>';
            });
        }
    </script>
</body>
</html>
