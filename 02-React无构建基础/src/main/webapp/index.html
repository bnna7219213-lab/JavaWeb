<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 无构建示例</title>
    <link rel="preconnect" href="https://esm.sh">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #61dafb; border-bottom: 2px solid #e8eaed; padding-bottom: 8px; }
        .card { background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 20px 0; border: 1px solid #e8eaed; }
        input { padding: 6px 10px; border: 1px solid #dadce0; border-radius: 4px; margin: 4px; }
        button { background: #61dafb; color: #202124; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #4fa8c7; }
        .msg { padding: 8px 12px; border-radius: 4px; margin-top: 10px; background: #e8f5e9; }
    </style>
</head>
<body>
    <!-- React 应用根节点 -->
    <div id="root"></div>

    <!-- Import Maps：模块名映射到 CDN 的 ESM 地址 -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "htm": "https://esm.sh/htm@3.1.1"
        }
    }
    </script>

    <!-- 加载入口脚本 -->
    <script type="module" src="./frontend/main.js"></script>
</body>
</html>
