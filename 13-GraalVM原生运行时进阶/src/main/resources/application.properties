# ============================================
# GraalVM Native Image - Advanced Configuration
# ============================================

# Application
spring.application.name=graalvm-native-advanced
server.port=8104

# AOT Configuration (full AOT mode)
spring.aot.enabled=true
spring.main.web-application-type=servlet
spring.main.lazy-initialization=false
spring.main.register-shutdown-hook=true

# Banner
spring.banner.location=classpath:banner.txt

# Jackson Configuration (Native optimized)
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Thymeleaf (Native Image requires cache=true)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.export.simple.enabled=true

# Application Info
info.app.name=GraalVM Native Advanced Demo
info.app.description=GraalVM Native Image - Full AOT Production Architecture
info.app.version=1.0.0
info.app.java.version=21
info.app.graalvm.enabled=true
info.app.aot.mode=full
info.app.native.supported=true

# Performance
spring.main.log-startup-info=true
spring.output.ansi.enabled=always

# Servlet Context
server.servlet.context-path=/
server.servlet.session.persistent=false
server.servlet.session.timeout=30m

# Compression (native friendly)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Logging (minimal for native)
logging.level.root=INFO
logging.level.com.example.graalvm=INFO
logging.level.org.springframework.boot=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5p) [%thread] %cyan(%-40.40logger{39}) : %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
logging.file.name=logs/application.log

# GraalVM Native specific
spring.native.remove-unused-autoconfig=true
spring.native.remove-yaml-support=false
spring.native.remove-xml-support=true
spring.native.remove-spel-support=true
