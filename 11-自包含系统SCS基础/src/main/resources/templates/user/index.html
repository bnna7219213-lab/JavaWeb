<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - User SCS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>用户管理</h1>
            <p class="subtitle" th:text="${scsName}">User SCS</p>
        </header>

        <nav class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/user/}" class="active">用户管理</a>
            <a th:href="@{/user/new}">创建用户</a>
            <a th:href="@{/user/messages}">消息监控</a>
            <a th:href="@{/user/scs-info}">SCS信息</a>
        </nav>

        <main class="content">
            <!-- 成功消息 -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="card">
                <div class="card-header">
                    <h2>用户列表 <span class="badge">共 <span th:text="${userCount}">0</span> 个用户</span></h2>
                    <a th:href="@{/user/new}" class="btn btn-primary">+ 创建用户</a>
                </div>

                <!-- 空状态 -->
                <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                    <p>暂无用户数据</p>
                    <a th:href="@{/user/new}" class="btn btn-primary">创建第一个用户</a>
                </div>

                <!-- 用户表格 -->
                <table th:if="${not #lists.isEmpty(users)}" class="table">
                    <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>手机号</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="mono" th:text="${user.userId}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone ?: '-'}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${user.status.name() == 'ACTIVE' ? 'status-active' :
                                                        (user.status.name() == 'INACTIVE' ? 'status-inactive' : 'status-suspended')}"
                                      th:text="${user.status}"></span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <form th:action="@{'/user/delete/' + ${user.userId}}" method="post"
                                      onsubmit="return confirm('确定要删除该用户吗? 将触发UserDeleted事件');">
                                    <button type="submit" class="btn btn-danger btn-sm">删除</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h3>SCS设计说明</h3>
                <div class="info-box">
                    <p><strong>自包含数据存储：</strong> 所有用户数据存储在User SCS专属的内存数据库中，
                    其他系统无法直接访问本数据库。</p>
                    <p><strong>事件驱动通信：</strong> 每次用户创建/更新/删除，都会发布对应的领域事件，
                    其他SCS可以通过订阅这些事件来做出响应。</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>User SCS - 自包含用户服务 | 端口: 8099</p>
        </footer>
    </div>
</body>
</html>
