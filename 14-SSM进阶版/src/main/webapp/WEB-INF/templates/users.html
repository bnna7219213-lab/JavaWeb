<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <nav class="topnav">
        <span class="brand">SSM 进阶版</span>
        <a th:href="@{/}">仪表盘</a>
        <a th:href="@{/users.html}">用户管理</a>
        <a th:href="@{/orders.html}">订单管理</a>
    </nav>

    <div class="container">
        <h1>用户管理</h1>

        <!-- 搜索 + 新增 -->
        <div class="card">
            <form method="get" th:action="@{/users.html}">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索姓名/邮箱..." />
                <button type="submit">搜索</button>
                <button type="button" class="secondary" onclick="document.getElementById('addForm').style.display='block'">+ 新增用户</button>
            </form>

            <!-- 新增表单（默认隐藏） -->
            <div id="addForm" style="display:none; margin-top:16px; border-top:1px solid #e8eaed; padding-top:16px;">
                <h3>新增用户</h3>
                <form onsubmit="return addUser(event)">
                    <div class="form-row"><label>姓名*</label><input type="text" id="name" required /></div>
                    <div class="form-row"><label>年龄</label><input type="number" id="age" /></div>
                    <div class="form-row"><label>邮箱</label><input type="email" id="email" /></div>
                    <div class="form-row"><label>电话</label><input type="text" id="phone" /></div>
                    <button type="submit">创建</button>
                    <button type="button" class="secondary" onclick="document.getElementById('addForm').style.display='none'">取消</button>
                </form>
            </div>
            <div id="msg"></div>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <h2>用户列表（共 <span th:text="${total}">0</span> 条）</h2>
            <table>
                <thead><tr><th>ID</th><th>姓名</th><th>年龄</th><th>邮箱</th><th>电话</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(users)}"><td colspan="7">暂无数据</td></tr>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.name}">张三</td>
                        <td th:text="${u.age}">24</td>
                        <td th:text="${u.email}">zhang@example.com</td>
                        <td th:text="${u.phone}">13800000000</td>
                        <td th:text="${u.createTime}">2024-01-01</td>
                        <td><button class="danger" th:onclick="'deleteUser(' + ${u.id} + ')'">删除</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
</body>
</html>
