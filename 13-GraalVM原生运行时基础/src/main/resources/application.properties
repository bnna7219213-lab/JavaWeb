# ============================================
# GraalVM Native Image - Basic Configuration
# ============================================

# Application
spring.application.name=graalvm-native-basic
server.port=8103

# AOT Configuration
spring.aot.enabled=true
spring.main.web-application-type=servlet
spring.main.lazy-initialization=false

# Banner
spring.banner.location=classpath:banner.txt

# Jackson Configuration (Native Friendly)
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Thymeleaf Cache (Native Images need cache enabled)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Info
info.app.name=GraalVM Native Basic Demo
info.app.description=GraalVM Native Image Basic Architecture Demo
info.app.version=1.0.0
info.app.java.version=21
info.app.graalvm.enabled=true

# JVM Performance Flags (for JVM mode comparison)
spring.main.log-startup-info=true

# Logging
logging.level.root=INFO
logging.level.com.example.graalvm=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
