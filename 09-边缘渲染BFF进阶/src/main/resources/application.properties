# ============================================
# 09-边缘渲染BFF进阶版 配置
# ============================================

# 服务端口 - BFF层独立端口
server.port=8096

# 应用名称
spring.application.name=edge-bff-advanced

# JSON格式化输出
spring.jackson.serialization.indent-output=true

# 日志级别
logging.level.com.aether.bff=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# 缓存配置（模拟边缘CDN缓存层）
# =============================================
# 缓存类型：使用ConcurrentMap模拟分布式缓存
spring.cache.type=simple
# Dashboard缓存TTL（秒），模拟CDN缓存过期
spring.cache.cache-names=dashboard,user-info,product-list,order-detail
